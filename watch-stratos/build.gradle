apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace 'com.parkinson.watch.stratos'
    compileSdk 30

    defaultConfig {
        applicationId 'com.parkinson.watch.stratos'
        minSdk 25
        targetSdk 29
        versionCode 1
        versionName '1.0.0'
        
        // Configuración específica para PaceOS/Amazfit Stratos
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
        
        // Forzar instalación en ROMs personalizadas
        manifestPlaceholders = [
            isPaceOS: "true",
            requiresNoSignature: "true"
        ]
    }
    
    splits {
        abi {
            enable true
            reset()
            include 'armeabi-v7a', 'arm64-v8a'
            universalApk true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        compose false
        buildConfig true
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}', '/META-INF/INDEX.LIST', '/META-INF/DEPENDENCIES']
        }
    }
    
    // Permitir instalación en ROMs modificadas
    lint {
        abortOnError false
        checkReleaseBuilds false
        disable 'HardcodedDebugMode', 'InvalidPackage'
    }
}

dependencies {
    implementation project(':shared')

    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.6.2'
    implementation 'androidx.activity:activity-ktx:1.8.2'

    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'

    implementation 'androidx.datastore:datastore-preferences:1.0.0'

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    implementation 'com.google.code.gson:gson:2.10.1'

    testImplementation 'junit:junit:4.13.2'
}
